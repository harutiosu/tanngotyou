<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <title>古文単語モード</title>
  <style>
    body { font-family: sans-serif; text-align: center; margin-top: 40px;}
    #choices button {
      font-size: 20px;
      margin: 10px;
      padding: 12px 30px;
      border: none;
      border-radius: 6px;
      background-color: #4CAF50;
      color: white;
      cursor: pointer;
    }
    #backBtn {
      position: fixed;
      top: 10px;       /* 左上に固定 */
      left: 10px;
      width: 40px;     /* 正方形にして丸くする */
      height: 40px;
      border-radius: 50%; /* 丸ボタン */
      border: none;
      background-color: #eee; /* 背景色はお好みで */
      font-size: 20px;
      font-weight: bold;
      cursor: pointer;
      box-shadow: 0 2px 5px rgba(0,0,0,0.2);
      transition: background-color 0.2s;
    }
    #backBtn:hover {
      background-color: #ddd; /* ホバー時の色変化 */
    }

    /* 左下にモード選択UIを固定 */
    #modeControls {
      position: fixed;
      bottom: 10px;
      left: 10px;
      font-size: 14px;
      background: #f9f9f9;
      padding: 8px;
      border: 1px solid #ccc;
      border-radius: 6px;
      text-align: left;
    }

    /* 「次へ」ボタンは結果欄の直後に自然に出す */
    #nextBtn {
      font-size: 20px;
      margin: 20px;
      padding: 12px 30px;
      border: none;
      border-radius: 6px;
      background-color: #ff0000;
      color: white;
      cursor: pointer;
    }
    #nextBtn:hover {
      background-color: rgb(199, 0, 0);
    }
  </style>
</head>
<body>
  <h1>古文単語モード（4択）</h1>
  <div id="question" style="font-size:24px; margin:20px;"></div>
  <p><font color="red">※カッコ内の単語の意味を答えてください(活用があるものは終止形での意味)</font></p>
  <div id="choices"></div>
  <div id="result" style="margin-top:20px; font-weight:bold;"></div>
  <button id="nextBtn" style="display:none;">次へ</button>

  <div id="modeControls">
    <label><input type="radio" name="mode" value="auto" checked> 自動</label>
    <input type="number" id="autoSeconds" value="2" min="1" style="width:50px;"> 秒後
    <br>
    <label><input type="radio" name="mode" value="manual"> 手動</label>
  </div>

  <button id="backBtn" onclick="location.href='index.html'">＜</button>

  <script>
    // 問題セット
    const quizData = [
      {
        question: "二千人の人を、竹取が家に(つかはす)。",
        choices: ["ご覧になる", "お預けになる", "おやりになる", "とどめなさる"],
        answer: "おやりになる",
        koword: "つかはす"
      },
      {
        question: "憶良らは今は(まから)む子泣くらむ。",
        choices: ["退出する", "お参りする", "お休みする", "お止めする"],
        answer: "退出する",
        koword: "まからむ"
      },
      {
        question: "かぐや姫をえ戦ひ止めずなりぬること、こまごまと(奏す)。",
        choices: ["(宮中に)申し上げる", "(春宮に)申し上げる", "(皇后に)申し上げる", "(天皇に)申し上げる"],
        answer: "(天皇に)申し上げる",
        koword: "奏す" 
      },
      {
        question: "親王、(大殿ごも)らで明かしたまうてけり。",
        choices: ["召し上がる", "お出かけになる", "お話になる", "お休みになる"],
        answer: "お休みになる",
        koword: "大殿ごもる"
      },
      {
        question: "天皇の、天の下(しろしめす)こと、四つの時、九帰りになむなりぬる。",
        choices: ["支え申し上げる", "お治めになる", "治め申し上げる", "お支えになる"],
        answer: "お治めになる",
        koword: "しろしめす" 
      },
      {
        question: "その秋、住吉に(詣で給ふ)。",
        choices: ["ご参詣になる", "ご招待になる", "ご命令になる", "ご参上になる"],
        answer: "ご参詣になる",
        koword: "詣で給ふ"
      },
      {
        question: "大御酒(まゐり)、御遊びなどし給ふ。",
        choices: ["お与えになる", "頂戴する", "召し上がる", "差し上げる"],
        answer: "召し上がる",
        koword: "まゐる"
      },
      {
        question: "「さること(候ひ)き」と申す。",
        choices: ["あります", "お話されます", "いらっしゃる", "おできになる"],
        answer: "あります",
        koword: "候ふ"
      },
      {
        question: "はや、この皇子にあひ(つかまつり)給へ。",
        choices: ["お仕えする", "いただく", "申し上げる", "あげる"],
        answer: "申し上げる",
        koword: "つかうまつる"
      },
      {
        question: "藤壺の宮、なやみ給ふことありて、(まかで)給へり。",
        choices: ["お召す", "退出する", "申し上げる", "お参りする"],
        answer: "退出する",
        koword: "まかづ"
      },
      {
        question: "その郎等を(召す)に、跡をくらみて失せぬ。",
        choices: ["おつかわしになる", "ご覧になる", "お仕えさせる", "お呼び寄せになる"],
        answer: "お呼び寄せになる",
        koword: "召す"
      },
      {
        question: "御硯召し寄せて、みづから御返事(あそばされ)けり。",
        choices: ["楽しまれる", "差し上げる", "なさる", "読まれる"],
        answer: "なさる",
        koword: "あそばす"
      },
      {
        question: "薬の壺に御文添へて(参らす)。",
        choices: ["差し上げる", "お尋ねする", "お伺いする", "奏上する"],
        answer: "差し上げる",
        koword: "参らす"
      },
      {
        question: "おほやけも(行幸)せしめたまふ。",
        choices: ["お治め", "お出かけ", "表敬", "参上"],
        answer: "お出かけ",
        koword: "行幸"
      },
      {
        question: "よきに奏し給へ、(啓し)給へ。",
        choices: ["(法皇に)申し上げる", "(宮中に)申し上げる", "(大臣に)申し上げる", "(皇后に)申し上げる"],
        answer: "(皇后に)申し上げる",
        koword: "啓す"
      },
      {
        question: "乞食、路のほとりに多く、(憂へ)悲しむ声耳に満てり。",
        choices: ["叫ぶ", "世をはかなむ", "心を痛める", "訴える"],
        answer: "訴える",
        koword: "憂ふ"
      },
      {
        question: "やや(ためらひ)て仰せ言伝へきこゆ。",
        choices: ["考えて", "躊躇して", "気を静めて", "気をしっかり持って"],
        answer: "気を静めて",
        koword: "ためらふ"
      },
      {
        question: "果ての日は、いと情けなう、互ひに言ふこともなく、我かしこげに物ひき(したため)、ちりぢりに行き別れぬ。",
        choices: ["処理する", "準備する", "手に持つ", "書き記す"],
        answer: "処理する",
        koword: "したたむ"
      },
      {
        question: "道も(さり)あへず立つ折もあるぞかし。",
        choices: ["通る", "探す", "避ける", "踏む"],
        answer: "避ける",
        koword: "さる"
      },
      {
        question: "(かたじけなく)も御硯召し寄せて、みづから御返事あそばされけり。",
        choices: ["うれしい", "ありがたい", "意外だ", "当然だ"],
        answer: "ありがたい",
        koword: "かたじけなし"
      },
      {
        question: "老い衰へて世に出て交じらひしは、(をこがましく)見えしかば、われはかくて閉ぢこもりぬべきぞ。",
        choices: ["おそれ多い", "虚しい", "愚かしい", "気難しい"],
        answer: "愚かしい",
        koword: "をこがまし"
      },
      {
        question: "御かたちひと清げに、あまり(あたらしき)さまして、ものより抜け出でたるやうにぞもりぬべきぞおはせし。",
        choices: ["初々しい", "もったいない", "素敵だ", "新鮮だ"],
        answer: "もったいない",
        koword: "あたらし"
      },
      {
        question: "何とかにかあらむ、(かきくらし)て涙こぶるる。",
        choices: ["感動で心が満たされる", "頭が真っ白になる", "心が傷つく", "悲しみが心を暗くする"],
        answer: "悲しみが心を暗くする",
        koword: "かきくらす"
      },
      {
        question: "知らぬわざしてまろも(困じ)にたり。そこも眠たげに思ほしためり。",
        choices: ["損する", "送れる", "疲れる", "窮する"],
        answer: "疲れる",
        koword: "困ず"
      },
      {
        question: "日ごろ月ざごろしるきことありてなやみわたるが、(おこたり)ぬるもうれし。",
        choices: ["病気が良くなる", "外に出る", "ゆっくりする", "勘違いする"],
        answer: "病気が良くなる",
        koword: "おこたる"
      },
      {
        question: "人に(おくれ)て四十九日の仏事にある聖を請じ侍りしに、説法いみじくして涙を流しけり。",
        choices: ["ならう", "依頼する", "先立たれる", "言われる"],
        answer: "先立たれる",
        koword: "おくれる"
      },
      {
        question: "舟の中にや老いをば(かこつ)らむ。",
        choices: ["冗談を言う", "不平を言う", "余裕を持つ", "自身を持つ"],
        answer: "不平を言う",
        koword: "かこつ"
      },
      {
        question: "後の世のこと心に忘れず、仏の道うとからぬ、(こころにくし)。",
        choices: ["心が穏やかだ", "憎らしい", "好きになれない", "奥ゆかしい"],
        answer: "奥ゆかしい",
        koword: "こころにくし"
      },
      {
        question: "身にやむごとなく思ふ人の(なやむ)を聞きて、いかにいかにとおぼつかなきことを嘆くに、おこたりたる由、消息聞くもいとうれし。",
        choices: ["死に近づく", "我慢する", "思い悩む", "病気で苦しむ"],
        answer: "病気で苦しむ",
        koword: "なやむ"
      },
      {
        question: "折ふし(いたはる)こと候ひて下り候はず。",
        choices: ["病気になる", "供養する", "気にかかる", "世話になる"],
        answer: "病気になる",
        koword: "いたはる"
      },
      {
        question: "命長ければ恥多し。長くとも四十に足らぬほどにて死なむこそ、(めやすかる)べけれ。",
        choices: ["潔い", "相応しい", "見苦しくない", "目安となる"],
        answer: "見苦しくない",
        koword: "めやすかる"
      },
      {
        question: "よろしき男を、下衆女などのほめて、「いみじう(なつかしう)おはします」など言へば、やがて思ひおとされぬべし。",
        choices: ["好ましい", "みずみずしい", "頼もしい", "相応しい"],
        answer: "好ましい",
        koword: "なつかし"
      },
      {
        question: "君は、思し怠る時の間もなく、(心苦し)くも恋しくも思し出づ。",
        choices: ["儚く", "寂しく", "気の毒に", "恐れ多く"],
        answer: "気の毒に",
        koword: "心苦し"
      },
      {
        question: "(はづかしき)人の、歌の本末問ひたるに、ふとおぼえたる、我ながらうれし。",
        choices: ["神聖な", "立派な", "気の毒な", "高貴な"],
        answer: "立派な",
        koword: "はづかし"
      },
      {
        question: "今ぞ(心やすく)黄泉路もまかるべき。",
        choices: ["簡単に", "薄情に", "安心して", "すっきりして"],
        answer: "安心して",
        koword: "心やすし"
      },
      {
        question: "下衆の家の女主人。痴れたる者。それしも(さかし)うて、まことにさかしき人を教へなどすかし。",
        choices: ["小賢しい", "情けない", "侘しい", "さもしい"],
        answer: "小賢しい",
        koword: "さかし"
      },
      {
        question: "愚かに(つたなき)人も、家に生まれ、時にあへば、高き位にのぼり、奢りを極むるもあり。",
        choices: ["なにもない", "見苦しい", "下品だ", "劣っている"],
        answer: "劣っている",
        koword: "つたなし"
      },
      {
        question: "上達部・上人などもあいなく目をそばめつついと(まばゆき)人の御おぼえなり。",
        choices: ["見ていられない", "言葉にできない", "近づけない", "信じられない"],
        answer: "見ていられない",
        koword: "まばゆし"
      },
      {
        question: "冬はつとめて。…いと寒きに、火などいそぎおこして、炭もてわたるもいと(つきづきし)。",
        choices: ["煩わしい", "目新しい", "似つかわしい", "清々しい"],
        answer: "似つかわしい",
        koword: "つきづきし"
      },
      {
        question: "(すきずきしき)方のみにあらず、土御門の御日記とて、世の中の鏡となむ承る。",
        choices: ["風流な", "通好みな", "物好きな", "高尚な"],
        answer: "風流な",
        koword: "すきずきし"
      },
      {
        question: "世もいまだ静まり候はねば、(しどけなき)事もぞ候ふとて御迎へに参つて候ふ。",
        choices: ["つまらない", "どうしようもない", "おかしな", "乱れた"],
        answer: "乱れた",
        koword: "しどけなし"
      },
      {
        question: "乳母替へてむ。いと(うしろめたし)。",
        choices: ["窮屈だ", "不吉だ", "心配だ", "無愛想だ"],
        answer: "心配だ",
        koword: "うしろめたし"
      },
      {
        question: "小少将の君は、そこはかとなくあてに(なまめかしう)、二月ばかりのしだり柳のさましたり。",
        choices: ["優美だ", "色っぽい", "気立てが良い", "繊細だ"],
        answer: "優美だ",
        koword: "なまめかし"
      },
      {
        question: "鶴は、いと(こちたき)さまなれど、鳴く声、雲居まで聞こゆる、いとめでたし",
        choices: ["神々しい", "苦々しい", "珍しい", "仰々しい"],
        answer: "仰々しい",
        koword: "こちたし"
      },
      {
        question: "なかなか長きよりもこよなう(いまめかし)きものかな。",
        choices: ["風流な", "現代風な", "華やかな", "大人びた"],
        answer: "現代風な",
        koword: "しどけなし"
      }
    ];

    const questionDiv = document.getElementById("question");
    const choicesDiv  = document.getElementById("choices");
    const resultDiv   = document.getElementById("result");
    const nextBtn     = document.getElementById("nextBtn");

    // 設定を保存する関数
    function saveSettings() {
      const mode = document.querySelector('input[name="mode"]:checked').value;
      const sec  = document.getElementById("autoSeconds").value;
      const settings = { mode: mode, seconds: sec };
      localStorage.setItem("quizSettings", JSON.stringify(settings));
    }

    // 設定を復元する関数
    function loadSettings() {
      const saved = JSON.parse(localStorage.getItem("quizSettings"));
      if (saved) {
        // モード復元
        document.querySelector(`input[name="mode"][value="${saved.mode}"]`).checked = true;
        // 秒数復元
        document.getElementById("autoSeconds").value = saved.seconds;
      }
    }

    // ページ読み込み時に復元
    window.addEventListener("DOMContentLoaded", loadSettings);

    // ラジオボタン変更時に保存
    document.querySelectorAll('input[name="mode"]').forEach(radio => {
      radio.addEventListener("change", saveSettings);
    });

    // 秒数入力変更時に保存
    document.getElementById("autoSeconds").addEventListener("input", saveSettings);

    // 正答率を記録する関数（単語をキーに保存）
    function updateStats(mode, word, answer, isCorrect) {
      const key = "stats_" + mode;
      let stats = JSON.parse(localStorage.getItem(key)) || {};
      if (!stats[word]) stats[word] = { answer: answer, correct: 0, wrong: 0 };
      if (isCorrect) stats[word].correct++;
      else stats[word].wrong++;
      localStorage.setItem(key, JSON.stringify(stats));
    }

    // 配列シャッフル
    function shuffle(array) {
      return array.sort(() => Math.random() - 0.5);
    }

    function showQuestion() {
      resultDiv.textContent = "";
      choicesDiv.innerHTML = "";

      // ランダムに問題を選ぶ
      const qIndex = Math.floor(Math.random() * quizData.length);
      const q = quizData[qIndex];

      questionDiv.textContent = q.question;

      // 選択肢をシャッフル
      const options = shuffle([...q.choices]);

      options.forEach(opt => {
        const btn = document.createElement("button");
        btn.textContent = opt;
        btn.onclick = () => {
          const correct = (opt === q.answer);
          resultDiv.textContent = correct ? "正解！" : `不正解… 正解は「${q.answer}」`;
          updateStats("kobun", q.koword, q.answer, correct); // ← 単語をキーに保存
          
          //モードによって次の問題に移る条件を変える
          const mode = document.querySelector('input[name="mode"]:checked').value;
          if (mode === "auto") {
            const sec = parseInt(document.getElementById("autoSeconds").value, 10) || 2;
            setTimeout(showQuestion, sec * 1000);
          } else {
            nextBtn.style.display = "inline-block"; // 手動モードなら「次へ」ボタンを表示
          }
        };
        choicesDiv.appendChild(btn);
      });
    }

    // 「次へ」ボタンで次の問題へ
    nextBtn.addEventListener("click", () => {
      nextBtn.style.display = "none"; // 押したら隠す
      showQuestion();
    });

    showQuestion();
  </script>
</body>
</html>
