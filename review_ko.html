    // 設定を保存する関数
    function saveSettings() {
      const mode = document.querySelector('input[name="mode"]:checked').value;
      const sec  = document.getElementById("autoSeconds").value;
      const settings = { mode: mode, seconds: sec };
      localStorage.setItem("quizSettings", JSON.stringify(settings));
    }

    // 設定を復元する関数
    function loadSettings() {
      const saved = JSON.parse(localStorage.getItem("quizSettings"));
      if (saved) {
        // モード復元
        document.querySelector(`input[name="mode"][value="${saved.mode}"]`).checked = true;
        // 秒数復元
        document.getElementById("autoSeconds").value = saved.seconds;
      }
    }

    // ページ読み込み時に復元
    window.addEventListener("DOMContentLoaded", loadSettings);

    // ラジオボタン変更時に保存
    document.querySelectorAll('input[name="mode"]').forEach(radio => {
      radio.addEventListener("change", saveSettings);
    });

    // 秒数入力変更時に保存
    document.getElementById("autoSeconds").addEventListener("input", saveSettings);

    // 成績データから正答率 threshold 未満の単語を抽出

        const total = data.correct + data.wrong;
        if (total === 0) continue;
        const rate = (data.correct / total) * 100;
        if (rate < threshold) {
          weakList.push(q);
        }
      }
      return weakList;
    }

    // 正答率を記録する関数（単語をキーに保存）
    function updateStats(mode, word, answer, isCorrect) {
      const key = "stats_" + mode;
      let stats = JSON.parse(localStorage.getItem(key)) || {};
      if (!stats[word]) stats[word] = { answer: answer, correct: 0, wrong: 0 };
      if (isCorrect) stats[word].correct++;
      else stats[word].wrong++;
      localStorage.setItem(key, JSON.stringify(stats));
    }

    function shuffle(array) {
      return array.sort(() => Math.random() - 0.5);
    }

    function showQuestion() {
      resultDiv.textContent = "";
      choicesDiv.innerHTML = "";

      const weakQuestions = getWeakQuestions(50);
      if (weakQuestions.length === 0) {
        questionDiv.textContent = "苦手単語はありません！";
        return;
      }

      const qIndex = Math.floor(Math.random() * weakQuestions.length);
      const q = weakQuestions[qIndex];

      questionDiv.textContent = q.question;

      // 選択肢をシャッフル
      const options = shuffle([...q.choices]);

      options.forEach(opt => {
        const btn = document.createElement("button");
        btn.textContent = opt;
        btn.onclick = () => {
          const correct = (opt === q.answer);
          resultDiv.textContent = correct ? "正解！" : `不正解… 正解は「${q.answer}」`;
          updateStats("kobun", q.koword, q.answer, correct);
          
          //モードによって次の問題に移る条件を変える
          const mode = document.querySelector('input[name="mode"]:checked').value;
          if (mode === "auto") {
            const sec = parseInt(document.getElementById("autoSeconds").value, 10) || 2;
            setTimeout(showQuestion, sec * 1000);
          } else {
            nextBtn.style.display = "inline-block"; // 手動モードなら「次へ」ボタンを表示
          }
        };
        choicesDiv.appendChild(btn);
      });
    }

    // 「次へ」ボタンで次の問題へ
    nextBtn.addEventListener("click", () => {
      nextBtn.style.display = "none"; // 押したら隠す
      showQuestion();
    });
    
    showQuestion();
  </script>
</body>
</html>
